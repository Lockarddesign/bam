name: Final two BAM blog releases
on:
  schedule:
    - cron: '17 11 29 9 *'
    - cron: '17 11 6 10 *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: final-two-blog-releases
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish only the two authorized 2026 releases
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10);
            const releases = {
              '2026-09-29': 'operating-room-humidity-ashrae-170-cms-waiver',
              '2026-10-06': 'cleaning-hvac-systems-in-an-occupied-hospital'
            };
            const repo = context.repo;
            if (!(date in releases)) {
              core.info('No release authorized for this date.');
              if (date > '2026-10-06') await github.rest.actions.disableWorkflow({...repo, workflow_id: 'blog-releases.yml'});
              return;
            }
            const started = new Date(Date.now() - 1000).toISOString();
            await github.rest.actions.createWorkflowDispatch({...repo, workflow_id: 'deploy.yml', ref: 'main'});
            let complete = false;
            for (let attempt = 0; attempt < 90; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 10000));
              const {data} = await github.rest.actions.listWorkflowRuns({...repo, workflow_id: 'deploy.yml', event: 'workflow_dispatch', branch: 'main', per_page: 10});
              const run = data.workflow_runs.find(r => r.created_at >= started);
              if (!run || run.status !== 'completed') continue;
              if (run.conclusion !== 'success') throw new Error(`Production deploy failed: ${run.html_url}`);
              complete = true;
              break;
            }
            if (!complete) throw new Error('Production deploy did not complete within 15 minutes.');
            const url = `https://buildingandair.com/blog/${releases[date]}/`;
            const page = await fetch(url);
            if (!page.ok || !(await page.text()).includes('<h1')) throw new Error(`Published page failed verification: ${url}`);
            await core.summary.addHeading('Blog published').addLink('Review the live article', url).write();
            if (date === '2026-10-06') await github.rest.actions.disableWorkflow({...repo, workflow_id: 'blog-releases.yml'});
